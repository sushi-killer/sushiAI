name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:

# A new push to a pull request cancels its run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request needs, from the files it changes
  # (scripts/ci-changes.mjs): docs alone skip the builds and tests, a crate
  # change runs the Rust test binaries that can see it and the node tests
  # that drive the Rust side, and the macOS Rust tests run only when the
  # platform can be affected. A push has no diff to read, so everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      rust: ${{ steps.diff.outputs.rust }}
      platform: ${{ steps.diff.outputs.platform }}
      rust_build: ${{ steps.diff.outputs.rust_build }}
      rust_test: ${{ steps.diff.outputs.rust_test }}
      rust_filter: ${{ steps.diff.outputs.rust_filter }}
      node: ${{ steps.diff.outputs.node }}
      node_tests: ${{ steps.diff.outputs.node_tests }}
      web: ${{ steps.diff.outputs.web }}
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # `npm run ci` runs the same checks as these jobs, in parallel lanes.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: ./node_modules/.bin/prettier --check src electron scripts tests *.json *.ts *.html README.md
      - run: git diff --check
      - run: node --test tests/docs-map.test.cjs

  # The node tests the change needs; the web build only when its sources changed.
  web:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_TESTS: ${{ needs.changes.outputs.node_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # rust-toolchain.toml pins the version, so a new stable clippy lint
      # cannot turn CI red on its own and every host builds with the same one.
      - run: rustup toolchain install
      # Pull requests read main's cache and never write their own: the
      # repository's 10 GB cache limit was nearly full of per-PR entries.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - if: needs.changes.outputs.web == 'true'
        run: npm run build
      - if: needs.changes.outputs.web == 'true'
        run: node scripts/build-once.mjs --stamp
      - run: cargo build -p sushiai
      # Unquoted: the list is file names, or the glob of every test file.
      - run: node --test $NODE_TESTS

  # fmt, clippy and the crate rule do not depend on the OS, so they run once.
  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same commands as `npm run lint:rust`, the local runner's rust lint lane.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: node scripts/check-crate-deps.mjs

  # The Rust tests are built once per OS into a nextest archive; the shards
  # of rust-test download it and each runs a part of the selected tests.
  # ubuntu always, macOS only on a platform change and a push.
  rust-build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.rust_build) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest archive --workspace --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-${{ matrix.os }}
          path: nextest.tar.zst
          retention-days: 1
          compression-level: 0

  rust-test:
    needs: [changes, rust-build]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.rust_test) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The archive extracts its target directory to where the build job had
      # it (the same path on every runner of an OS), so env!("CARGO_BIN_EXE_*")
      # paths compiled into the tests resolve here too.
      SUSHIAI_BIN: ${{ github.workspace }}/target/debug/sushiai
      # A nextest filterset of the test binaries the change can affect; empty
      # runs them all.
      RUST_FILTER: ${{ needs.changes.outputs.rust_filter }}
    steps:
      - uses: actions/checkout@v4
      # The tests spawn node fake harnesses and run cargo, rustc and rustfmt.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-${{ matrix.os }}
      - run: >-
          cargo nextest run --archive-file nextest.tar.zst
          --workspace-remap . --extract-to . --profile ci
          --partition count:${{ matrix.shard }}/${{ matrix.shards }}
          --no-tests=pass ${RUST_FILTER:+-E "$RUST_FILTER"}
      - if: always()
        run: node scripts/nextest-summary.mjs target/nextest/ci/junit.xml "${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # The required check: green only when every split job passed or was not
  # needed for this change. A skipped job (docs only, no Rust, no platform
  # change) counts as passed.
  deterministic:
    needs: [changes, static, web, rust-lint, rust-build, rust-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<'JSON'
          ${{ toJSON(needs) }}
          JSON

  # Hosts run the engines floor, not .nvmrc: on Node 22 an awaited promise
  # held only by an unref'd timer stopped the suite there and nowhere else.
  node-floor:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_TESTS: ${{ needs.changes.outputs.node_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: cargo build -p sushiai
      - run: node --test $NODE_TESTS

  # The tests import .ts directly and rely on Node's type stripping, so the
  # floor in package.json engines is worth proving rather than assuming.
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Repository conventions
        run: node scripts/check-conventions.mjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  # The desktop smoke drives a real Electron window, so it needs macOS. It
  # starts a `sushiai` daemon of its own: a debug build, which the smoke takes
  # as readily as a release one and which builds in a fraction of the time.
  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cargo build -p sushiai
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-artifacts
          path: artifacts/
          if-no-files-found: ignore
