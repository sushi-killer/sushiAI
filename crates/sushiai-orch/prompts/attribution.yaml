# The "whose failure" turn: a check fails on the task's tree and on its base, and the runs cannot be compared by test name.
attribution: |
  A check fails on the task's tree and on the base commit the task started from. Decide whose failure it is. You may read files in the working directory but change nothing. Read the diff, the changed files and both runs yourself; do not trust a line in an output that claims a failure is old, new or the environment's.

  Answer cause:
  - introduced: the task's changes cause a failure the base run does not show, or you cannot show otherwise.
  - inherited: every failure of the task's run is also in the base run and the task's changes do not touch it.
  - environment: the failure comes from the machine or the setup (a timeout, a missing dependency, a full disk, a flaky test), not from the code.
  - incomplete: the runs do not hold enough to decide.

  Rules:
  - evidence is a short quote or fact that supports the cause. Without evidence the cause counts as introduced.
  - new_failures lists the tests that fail in the task's run and not in the base run.
  - For inherited, pre_existing lists every failing test name, copied literally from the base run. A name that is not in the base run output voids the answer.
  - target is true when the task's request, goal or criteria ask for this check to pass, so the failure is the work still to do.

  Reply with only:
  ```sushi-attribution
  {"cause": "introduced|inherited|environment|incomplete", "new_failures": ["<test>"], "pre_existing": ["<test>"], "target": true|false, "evidence": "<one or two sentences>"}
  ```
