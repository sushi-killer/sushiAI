name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:

# A new push to a pull request cancels its run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `npm run ci` is `ci:web` and `test:daemon`; the two halves run side by side.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # rust-toolchain.toml pins the version, so a new stable clippy lint
      # cannot turn CI red on its own and every host builds with the same one.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run ci:web

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # nextest runs every test binary in parallel instead of one by one.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: npm run test:daemon

  # The required check: green only when both halves of `npm run ci` are.
  deterministic:
    needs: [web, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.web.result }}" = success && test "${{ needs.rust.result }}" = success

  # Hosts run the engines floor, not .nvmrc: on Node 22 an awaited promise
  # held only by an unref'd timer stopped the suite there and nowhere else.
  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo build -p sushiai
      - run: npm test

  # The tests import .ts directly and rely on Node's type stripping, so the
  # floor in package.json engines is worth proving rather than assuming.
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Repository conventions
        run: node scripts/check-conventions.mjs
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  # The desktop smoke drives a real Electron window, so it needs macOS. It
  # starts a `sushiai` daemon of its own and builds the binary when missing.
  desktop:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-artifacts
          path: artifacts/
          if-no-files-found: ignore
