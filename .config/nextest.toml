# Setup scripts are still experimental in nextest (0.9.148): turn them on for this repo.
experimental = ["setup-scripts"]
# The tests mostly wait on daemons and child processes, not the CPU: run more
# of them at once than the runner has cores.
[profile.default]
test-threads = 12

# The tests that start the daemon share one binary, built once before the first of them
# runs (see the script) instead of each building or relinking it.
[scripts.setup.sushiai-bin]
command = 'node scripts/nextest-sushiai-bin.mjs'

[[profile.default.scripts]]
filter = 'package(=sushiai) | package(=sushiai-orch)'
setup = 'sushiai-bin'

# CI (`--profile ci`): a failed test runs once more. One that passes on the
# retry is FLAKY: scripts/nextest-summary.mjs lists it in the job summary and
# as a warning, so a retry never hides it. A test still running after 4 min is
# stopped. The waits of one test share a 200 s budget (crates/test_wait.rs), so a hang
# fails with its own message before the runner stops it.
[profile.ci]
test-threads = 12
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[[profile.ci.scripts]]
filter = 'package(=sushiai) | package(=sushiai-orch)'
setup = 'sushiai-bin'
