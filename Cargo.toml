[workspace]
members = ["crates/*"]
exclude = ["orchd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
vt100 = "0.15"
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
base64 = "0.22"
libc = "0.2"
sushiai-protocol = { path = "crates/sushiai-protocol" }
sushiai-core = { path = "crates/sushiai-core" }
sushiai-daemon = { path = "crates/sushiai-daemon" }
sushiai-hold = { path = "crates/sushiai-hold" }

[profile.dev]
debug = "line-tables-only"
# Short-lived worktrees never reuse incremental data; off lets sccache cache across them.
incremental = false
