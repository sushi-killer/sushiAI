[package]
name = "orchd"
version = "0.1.0"
edition = "2021"
description = "sushiAI task orchestrator daemon"
license = "MIT"
publish = false

[[bin]]
name = "orchd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "process",
  "io-util",
  "sync",
  "time",
  "macros",
  "signal",
  "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
